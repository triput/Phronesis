{% load phronesis_extras %}
{# Renders a pastel-style chip using --chip-color (domain/tag hex from DB). #}
<span class="phronesis-chip shrink-0{% if icon %} phronesis-chip--with-icon{% endif %}" style="--chip-color: {{ color }}">
  {% if icon %}{% heroicon name=icon size="xs" css_class="phronesis-chip-icon phronesis-domain-icon" %}{% endif %}
  {{ label }}
</span>
